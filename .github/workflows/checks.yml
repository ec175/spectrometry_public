name: Repository checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q engines tools tests
      - name: Run repository smoke checks
        run: python -m unittest discover -s tests -v

  wind-tunnel-solvers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Wind Tunnel dependencies
        run: python -m pip install -r engines/wind-tunnel/src/requirements.txt
      - name: Check Sod shock tube
        working-directory: engines/wind-tunnel/src
        run: python tools/sod_check.py
      - name: Check oblique shock
        working-directory: engines/wind-tunnel/src
        run: python tools/shock_check.py
