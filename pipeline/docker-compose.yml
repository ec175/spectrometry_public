services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: n8n-shorts:latest
    container_name: n8n-shorts
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- Core ---
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Detroit}
      - TZ=${GENERIC_TIMEZONE:-America/Detroit}
      # Public HTTPS base for OAuth providers that reject http://localhost
      # (e.g. TikTok). Point this at your own tunnel (Tailscale Funnel, ngrok,
      # cloudflared, ...). Set it in your .env; never commit the real value.
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      # --- Auth (basic gate in front of the editor) ---
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # --- Encryption key for stored credentials (DO NOT lose/change) ---
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # --- ffmpeg / community nodes ---
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      # Allow the Read/Write Files node to read mounted handoff folders
      # (default whitelist is only /home/node/.n8n-files). Semicolon-separated.
      - N8N_RESTRICT_FILE_ACCESS_TO=/files;/incoming;/library
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
      - ./incoming:/incoming
      # Read-only view of your source-render tree. Adjust the host path to wherever
      # your finished videos live; the render service stages into ./incoming.
      - ../:/library:ro

volumes:
  n8n_data:
